<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Background สีขาว -->
  <rect width="600" height="400" fill="#FFFFFF"/>

  <!-- กรอบรูปภาพสีเทา -->
  <rect x="140" y="70" width="320" height="210" rx="4" stroke="#8E8E8E" stroke-width="12" fill="none"/>
  
  <!-- เส้นกรอบด้านในชั้นที่สอง -->
  <rect x="156" y="86" width="288" height="178" stroke="#8E8E8E" stroke-width="4" fill="none"/>

  <!-- พระอาทิตย์ / วงกลม -->
  <circle cx="310" cy="135" r="16" stroke="#8E8E8E" stroke-width="8" fill="none"/>

  <!-- ภูเขาลูกใหญ่ (ซ้าย) -->
  <path d="M162 250 L260 155 L350 250" stroke="#8E8E8E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ภูเขาลูกเล็ก (ขวา) -->
  <path d="M295 250 L360 180 L438 250" stroke="#8E8E8E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ข้อความ No image สีเทา ตัวเอียง -->
  <text x="50%" y="330" dominant-baseline="middle" text-anchor="middle" fill="#B0B0B0" font-family="'Courier New', Courier, monospace, sans-serif" font-style="italic" font-size="28" letter-spacing="2">
    No image
  </text>
</svg>
